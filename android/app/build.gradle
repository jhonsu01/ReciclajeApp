plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.reciclaje.turnero'
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName "0.6.0"
    }

    buildFeatures {
        buildConfig true
    }

    // Tres APKs desde el mismo código:
    //  - completa: app multirol (com.reciclaje.turnero) — la usan pesaje y administrador
    //  - cliente:  solo el rol cliente (com.reciclaje.turnero.cliente)
    //  - kiosko:   solo turnero para TV, arranca al encender (com.reciclaje.turnero.kiosko)
    flavorDimensions "modo"
    productFlavors {
        completa {
            dimension "modo"
            applicationId "com.reciclaje.turnero"
            buildConfigField "boolean", "KIOSKO_APP", "false"
            buildConfigField "boolean", "CLIENTE_APP", "false"
        }
        cliente {
            dimension "modo"
            applicationId "com.reciclaje.turnero.cliente"
            buildConfigField "boolean", "KIOSKO_APP", "false"
            buildConfigField "boolean", "CLIENTE_APP", "true"
        }
        kiosko {
            dimension "modo"
            applicationId "com.reciclaje.turnero.kiosko"
            buildConfigField "boolean", "KIOSKO_APP", "true"
            buildConfigField "boolean", "CLIENTE_APP", "false"
        }
    }

    signingConfigs {
        release {
            storeFile file('../keystore/reciclaje.keystore')
            storePassword 'reciclaje2026'
            keyAlias 'reciclaje'
            keyPassword 'reciclaje2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.zxing:core:3.5.3'
}
